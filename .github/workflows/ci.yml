name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package quality gate
    # One platform only: font rasterisation differs per OS, so goldens are only
    # meaningful against a single runner. See test/golden/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test (pure and widget tiers)
        run: flutter test -x golden

      # Skipped until baselines are committed. Record them with the
      # "Record goldens" workflow, never on a local Windows or macOS machine.
      - name: Test (golden tier)
        if: hashFiles('test/golden/goldens/*.png') != ''
        run: |
          flutter precache --universal
          flutter test --tags golden

      - name: API docs
        run: dart doc --dry-run .

      - name: Publish dry run
        run: flutter pub publish --dry-run

      # The same tool pub.dev scores uploads with. Non-blocking for now, so a
      # point lost to something outside the code (repository checks before the
      # first push to main, for instance) does not turn every build red.
      - name: pana
        continue-on-error: true
        run: |
          # pana shells out to these to validate screenshots; without them it
          # reports "No such file or directory" for every image and scores the
          # example-and-screenshots check 0. pub.dev's analyzer has them.
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .

  example:
    name: Example app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
