name: Record goldens

# Run by hand from the Actions tab. Renders the golden baselines on the same
# ubuntu-latest image CI compares against, and uploads them as an artifact to
# download and commit into test/golden/goldens/.
on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The frames render in Roboto, loaded from the SDK cache rather than
      # vendored into the repo. Without this the whole tier skips itself and
      # the upload below finds nothing.
      - name: Fetch the material fonts
        run: flutter precache --universal

      # Temporary: shows where the SDK actually keeps its fonts on the runner.
      - name: Where are the fonts
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          ls -la "$FLUTTER_ROOT" || true
          ls -la "$FLUTTER_ROOT/bin/cache/artifacts" || true
          find "$FLUTTER_ROOT" -iname 'roboto*regular*' -print 2>/dev/null | head -20
          find / -iname 'roboto-regular.ttf' -print 2>/dev/null | head -10

      - name: Record baselines
        run: flutter test --tags golden --update-goldens

      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: test/golden/goldens/*.png
          if-no-files-found: error
