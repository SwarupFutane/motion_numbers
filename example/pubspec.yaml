name: example
description: >-
  Showcase app for motion_number: a style gallery, a live portfolio ticker and
  a playground for duration and stagger.

# Never published; it exists so pub.dev can render an Example tab.
publish_to: 'none'

version: 1.0.0+1

# Matches the package's own floor, so anyone who can use motion_number can run
# this example.
environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # The working tree, not a published version. Getting this wrong means the
  # example silently demos the wrong code.
  motion_number:
    path: ../

  # The demo is an iOS-styled app; every icon in it is a CupertinoIcons glyph.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter (SIL OFL 1.1, see fonts/LICENSE.txt) stands in for SF Pro off Apple
  # platforms; on iOS and macOS the app uses the system font instead.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
