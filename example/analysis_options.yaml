include: package:flutter_lints/flutter.yaml

# Mirrors the package's options, minus `public_member_api_docs`: an example app
# has no public API, and a dartdoc comment on every `_ScreenState` would make
# the sample read worse than the code it is meant to demonstrate.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
